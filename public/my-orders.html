<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - TrendyShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top glass-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-hexagon-fill text-primary"></i> TrendyShop
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Products</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center" id="nav-actions">
          <!-- Dynamically populated -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5 min-vh-75">
    <h2 class="fw-bold mb-4">My Orders</h2>

    <div id="loader" class="text-center py-5" style="display: none;">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="orders-list">
      <!-- Populated via JS -->
    </div>

    <div id="empty-orders" class="text-center py-5" style="display: none;">
      <i class="bi bi-box-seam text-muted" style="font-size: 4rem;"></i>
      <h3 class="mt-3 text-muted">You have no orders yet</h3>
      <a href="index.html" class="btn btn-primary mt-3 px-4">Start Shopping</a>
    </div>

  </div>

  <footer class="bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Online Mini Shop</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const loader = document.getElementById('loader');
      loader.style.display = 'block';

      const orders = await fetchMyOrders();
      loader.style.display = 'none';

      const list = document.getElementById('orders-list');
      const emptyEl = document.getElementById('empty-orders');

      if (!orders || orders.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }

      list.innerHTML = orders.map(o => {
        const itemsHtml = o.items.map(i => `
          <div class="d-flex justify-content-between text-muted small border-bottom py-2">
            <span>${i.quantity}x ${i.name}</span>
            <span>$${parseFloat(i.price).toFixed(2)}</span>
          </div>
        `).join('');

        return `
          <div class="card mb-4 shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
              <div>
                <h6 class="fw-bold mb-0">Order #${o.id}</h6>
                <small class="text-muted">Placed on ${new Date(o.created_at).toLocaleDateString()}</small>
              </div>
              <span class="badge ${o.status === 'Completed' ? 'bg-success' : 'bg-primary'}">${o.status}</span>
            </div>
            <div class="card-body">
              <div class="mb-3">
                ${itemsHtml}
              </div>
              <div class="d-flex justify-content-end align-items-center mt-2 pt-2">
                <span class="fs-6 text-muted me-2">Total:</span>
                <span class="fs-5 fw-bold text-dark">$${parseFloat(o.total_price).toFixed(2)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>

</html>
