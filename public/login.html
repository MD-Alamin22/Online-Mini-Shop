<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TrendyShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top glass-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-hexagon-fill text-primary"></i> TrendyShop
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Products</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5 d-flex justify-content-center align-items-center min-vh-75">
    <div class="card shadow-lg border-0 auth-card">
      <div class="card-body p-5">
        <h3 class="text-center fw-bold mb-4">Welcome Back</h3>
        <div id="error-msg" class="alert alert-danger d-none"></div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold">Email Address</label>
            <input type="email" class="form-control form-control-lg" id="email" required placeholder="name@example.com">
          </div>
          <div class="mb-4">
            <label class="form-label text-muted fw-semibold">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold p-hover">Sign In</button>
        </form>
        <p class="text-center mt-4 mb-0 text-muted">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold">Register</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      
      const res = await loginUser(email, password);
      if (res.error) {
        errorMsg.textContent = res.error;
        errorMsg.classList.remove('d-none');
      } else {
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        window.location.href = res.user.role === 'admin' ? 'admin.html' : 'index.html';
      }
    });
  </script>
</body>
</html>
