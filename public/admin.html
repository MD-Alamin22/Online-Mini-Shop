<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - TrendyShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top glass-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-hexagon-fill text-primary"></i> TrendyShop <span class="badge bg-danger fs-6 ms-2">Admin</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">View Store</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center" id="nav-actions">
          <!-- Dynamically populated -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5 min-vh-75">
    <h2 class="fw-bold mb-4">Admin Dashboard</h2>

    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-semibold" id="products-tab" data-bs-toggle="tab" data-bs-target="#products-pane" type="button" role="tab">Products</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-semibold" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders-pane" type="button" role="tab">Orders</button>
      </li>
    </ul>

    <div class="tab-content" id="adminTabsContent">
      <!-- Products Pane -->
      <div class="tab-pane fade show active" id="products-pane" role="tabpanel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="m-0">Manage Products</h4>
          <button class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareAdd()">
            <i class="bi bi-plus-lg"></i> Add Product
          </button>
        </div>
        <div class="table-responsive bg-white rounded shadow-sm">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-product-list">
              <!-- JS Populated -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Orders Pane -->
      <div class="tab-pane fade" id="orders-pane" role="tabpanel">
        <h4 class="mb-3">Customer Orders</h4>
        <div id="admin-order-list">
          <!-- JS Populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Product Modal (Add/Edit) -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="productModalLabel">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="product-form">
            <input type="hidden" id="prod-id">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="prod-name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="prod-desc" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" step="0.01" class="form-control" id="prod-price" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Image Upload</label>
              <input type="file" class="form-control" id="prod-image" accept="image/*">
              <input type="hidden" id="prod-existing-image">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveProduct()">Save Product</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast for Notifications -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toast-message">Success!</div>
        <button type="button" class="btn-close btn-close-white me-2" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Enforce Admin Access
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'admin') {
      window.location.href = 'index.html';
    }

    let pModal;

    document.addEventListener('DOMContentLoaded', () => {
      pModal = new bootstrap.Modal(document.getElementById('productModal'));
      loadAdminProducts();
      loadAdminOrders();
    });

    async function loadAdminProducts() {
      const prods = await fetchProducts();
      const tbody = document.getElementById('admin-product-list');
      tbody.innerHTML = '';
      if (!prods || prods.error) return;
      
      prods.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>#${p.id}</td>
            <td><img src="${p.image_url}" alt="Img" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;"></td>
            <td class="fw-medium">${p.name}</td>
            <td>$${parseFloat(p.price).toFixed(2)}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2" onclick="prepareEdit(${p.id}, '${p.name.replace(/'/g, "\\'")}', '${(p.description||'').replace(/'/g, "\\'")}', ${p.price}, '${p.image_url}')"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteProd(${p.id})"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function prepareAdd() {
      document.getElementById('productModalLabel').textContent = 'Add Product';
      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
    }

    function prepareEdit(id, name, desc, price, url) {
      document.getElementById('productModalLabel').textContent = 'Edit Product';
      document.getElementById('prod-id').value = id;
      document.getElementById('prod-name').value = name;
      document.getElementById('prod-desc').value = desc;
      document.getElementById('prod-price').value = price;
      document.getElementById('prod-existing-image').value = url;
      document.getElementById('prod-image').value = '';
      pModal.show();
    }

    async function saveProduct() {
      const id = document.getElementById('prod-id').value;
      const fileInput = document.getElementById('prod-image');
      
      const formData = new FormData();
      formData.append('name', document.getElementById('prod-name').value);
      formData.append('description', document.getElementById('prod-desc').value);
      formData.append('price', document.getElementById('prod-price').value);
      
      if (id && document.getElementById('prod-existing-image').value) {
        formData.append('image_url', document.getElementById('prod-existing-image').value);
      }
      
      if (fileInput.files.length > 0) {
        formData.append('image', fileInput.files[0]);
      }

      let res;
      if (id) {
        res = await updateProduct(id, formData);
      } else {
        res = await createProduct(formData);
      }

      if (res.error) {
        showToast(res.error);
      } else {
        showToast(id ? 'Product updated!' : 'Product added!');
        pModal.hide();
        loadAdminProducts(); // Reload
      }
    }

    async function deleteProd(id) {
      if (confirm('Are you sure you want to delete this product?')) {
        const res = await deleteProduct(id);
        if(!res.error) {
          showToast('Product deleted');
          loadAdminProducts();
        }
      }
    }

    async function loadAdminOrders() {
      const orders = await fetchAllOrders();
      const list = document.getElementById('admin-order-list');
      list.innerHTML = '';
      if (!orders || orders.length === 0) {
        list.innerHTML = '<p class="text-muted">No orders found.</p>';
        return;
      }

      orders.forEach(o => {
        let itemsHtml = o.items.map(i => `<li>${i.quantity}x ${i.name} - $${i.price}</li>`).join('');
        list.innerHTML += `
          <div class="card mb-3 shadow-sm border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold m-0">Order #${o.id}</h6>
                <span class="badge bg-secondary">${new Date(o.created_at).toLocaleDateString()}</span>
              </div>
              <p class="mb-1 text-muted"><i class="bi bi-person"></i> ${o.customer_name} (${o.customer_email})</p>
              <ul class="text-muted small">
                ${itemsHtml}
              </ul>
              <div class="text-end fw-bold text-primary">
                Total: $${parseFloat(o.total_price).toFixed(2)}
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
