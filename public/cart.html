<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - TrendyShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top glass-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-hexagon-fill text-primary"></i> TrendyShop
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Products</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center" id="nav-actions">
          <!-- Dynamically populated -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5 min-vh-75">
    <h2 class="fw-bold mb-4">Your Shopping Cart</h2>
    
    <div class="row" id="cart-content">
      <!-- Cart Items list -->
      <div class="col-lg-8" id="cart-items">
        <!-- Rendered via JS -->
      </div>
      
      <!-- Order Summary -->
      <div class="col-lg-4" id="cart-summary" style="display: none;">
        <div class="card shadow-sm border-0 sticky-top" style="top: 100px;">
          <div class="card-body p-4">
            <h4 class="fw-bold mb-4">Order Summary</h4>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted">Subtotal</span>
              <span class="fw-bold" id="cart-subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted">Shipping</span>
              <span class="fw-bold text-success">Free</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-4">
              <span class="fw-bold fs-5">Total</span>
              <span class="fw-bold fs-5 text-primary" id="cart-total">$0.00</span>
            </div>
            <button id="btn-checkout" class="btn btn-primary w-100 btn-lg fw-bold p-hover">Proceed to Checkout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty Cart state -->
    <div id="empty-cart" class="text-center py-5" style="display: none;">
      <i class="bi bi-cart-x text-muted" style="font-size: 4rem;"></i>
      <h3 class="mt-3 text-muted">Your cart is empty</h3>
      <a href="index.html" class="btn btn-primary mt-3 px-4">Continue Shopping</a>
    </div>

    <!-- Success Order State -->
    <div id="order-success" class="text-center py-5" style="display: none;">
      <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
      <h2 class="mt-3 fw-bold">Order Placed Successfully!</h2>
      <p class="text-muted">Thank you for shopping with us.</p>
      <a href="my-orders.html" class="btn btn-primary mt-3 px-4">View My Orders</a>
      <a href="index.html" class="btn btn-outline-secondary mt-3 px-4 ms-2">Continue Shopping</a>
    </div>

  </div>

  <footer class="bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 TrendyShop. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
      
      document.getElementById('btn-checkout').addEventListener('click', async () => {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
          showToast('Please login to checkout');
          setTimeout(() => window.location.href = 'login.html', 1500);
          return;
        }

        const cart = getCart();
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        
        const payload = {
          items: cart,
          totalPrice: total
        };

        const res = await placeOrder(payload);
        if (res.error) {
          showToast(res.error);
        } else {
          localStorage.removeItem('cart');
          document.getElementById('cart-content').style.display = 'none';
          document.getElementById('order-success').style.display = 'block';
          updateCartIcon();
        }
      });
    });
  </script>
</body>
</html>
